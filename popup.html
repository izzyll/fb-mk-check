<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Marketplace Visto</title>
  <style>
    body { width: 380px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: #18191a; color: #e4e6eb; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .count { color: #b0b3b8; margin-bottom: 12px; }
    .count b { color: #fff; font-size: 16px; }
    fieldset { border: 1px solid #3a3b3c; border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
    legend { color: #b0b3b8; padding: 0 4px; }
    label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
    .row { display: flex; gap: 6px; margin-top: 6px; }
    button { flex: 1; border: none; border-radius: 6px; padding: 7px; font: inherit; font-weight: 600; cursor: pointer; background: #3a3b3c; color: #e4e6eb; }
    button:hover { background: #4e4f50; }
    button.danger { background: #5c1f1b; }
    button.danger:hover { background: #7a2822; }
    #msg { min-height: 16px; color: #8fd19e; margin-top: 8px; font-size: 12px; }

    details { border: 1px solid #3a3b3c; border-radius: 8px; margin-bottom: 10px; }
    summary { cursor: pointer; padding: 8px 10px; font-weight: 600; }
    .list-wrap { padding: 0 8px 8px; }
    #search { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #3a3b3c; background: #242526; color: #e4e6eb; font: inherit; }
    #list { max-height: 300px; overflow-y: auto; }
    .item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid #2a2b2c; }
    .item:last-child { border-bottom: none; }
    .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: #3a3b3c; }
    .info { flex: 1; min-width: 0; }
    .info a { color: #e4e6eb; text-decoration: none; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info a:hover { text-decoration: underline; color: #4599ff; }
    .sub { color: #b0b3b8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price { color: #8fd19e; }
    .del { flex: none; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: transparent; color: #b0b3b8; font-size: 15px; }
    .del:hover { background: #5c1f1b; color: #fff; }
    .empty { color: #b0b3b8; padding: 8px 4px; text-align: center; }
  </style>
</head>
<body>
  <h1>👁 Marketplace Visto</h1>
  <div class="count"><b id="count">0</b> avisos marcados como vistos</div>

  <details id="listBox" open>
    <summary>Lista de vistos</summary>
    <div class="list-wrap">
      <input id="search" type="search" placeholder="Buscar por título o precio…">
      <div id="list"></div>
    </div>
  </details>

  <fieldset>
    <legend>Avisos vistos</legend>
    <label><input type="radio" name="mode" value="dim"> Atenuar (gris y transparente)</label>
    <label><input type="radio" name="mode" value="hide"> Ocultar</label>
    <label><input type="radio" name="mode" value="off"> Mostrar normal</label>
  </fieldset>

  <fieldset>
    <legend>Opciones</legend>
    <label><input type="checkbox" id="autoMarkOnOpen"> Marcar como visto al abrir un aviso</label>
    <label><input type="checkbox" id="showToolbar"> Mostrar barra flotante</label>
  </fieldset>

  <div class="row">
    <button id="export">Exportar</button>
    <button id="import">Importar</button>
  </div>
  <div class="row">
    <button id="clear" class="danger">Borrar todos los vistos</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
